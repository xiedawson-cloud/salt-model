[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "molten-salt-reactor-corrosion-model"
version = "0.4.0"
description = "Reproducible reduced-order molten-salt corrosion, tracer, and idealized spatial transport model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]
[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
